<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161c">
<title>Tasks</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 12.5l3 3 6-7"/></svg><span>Tasks</span></div>
    <nav id="lists" aria-label="Lists"></nav>
    <button class="side-btn" id="newListBtn"><span class="ico">＋</span> New list</button>
    <button class="side-btn subtle" id="archiveToggle"><span class="ico">🗄</span> <span id="archiveLabel">Archived</span></button>
    <button class="side-btn subtle" id="settingsBtn"><span class="ico">⚙</span> Connect apps</button>
    <div class="clock" id="clock"></div>
  </aside>

  <main id="main">
    <header id="head">
      <div class="title-wrap">
        <h1 id="listTitle">Tasks</h1>
        <div id="listMeta" class="meta"></div>
      </div>
      <div class="toolbar">
        <button class="tool" id="voiceBtn" title="Voice input (X / Play)"><span class="ico">🎤</span><span>Voice</span></button>
        <button class="tool" id="quickBtn" title="Frequent items"><span class="ico">⚡</span><span>Quick add</span></button>
        <button class="tool" id="printBtn"><span class="ico">🖨</span><span>Print</span></button>
        <button class="tool" id="shareBtn"><span class="ico">↗</span><span>Share</span></button>
        <button class="tool" id="moreBtn" title="List options (Menu)"><span class="ico">⋯</span><span>More</span></button>
      </div>
    </header>

    <form id="addBar" autocomplete="off">
      <input id="addInput" placeholder="Add a task… try “milk tomorrow at 5pm”" enterkeyhint="done" maxlength="300">
      <button type="button" class="chip-btn" id="dueChip">📅 <span id="dueChipText">No date</span></button>
      <button type="submit" class="primary" id="addBtn">Add</button>
    </form>

    <div id="freqRow" class="freq-row" aria-label="Frequent items"></div>

    <section id="taskWrap">
      <ul id="tasks"></ul>
      <div id="empty" class="empty" hidden></div>
    </section>

    <section id="archiveView" hidden>
      <h2>Archived lists</h2>
      <ul id="archived"></ul>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<div id="hint" class="hint">Arrows / D-pad move · OK / A select · Back / B close · X voice · Y add · ⏪ ⏩ / LB RB switch list</div>

<script src="dates.js"></script>
<script src="nav.js"></script>
<script src="app.js"></script>
</body>
</html>
